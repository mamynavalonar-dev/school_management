services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker.local
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - school_mysql_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: /ws
    restart: unless-stopped
    env_file:
      - .env.docker.local
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "3306"
      WS_PORT: "3001"
      WS_DEBUG: "false"
      REALTIME_INTERNAL_URL: http://127.0.0.1:3001/internal/notify
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - school_profile_uploads:/var/www/backend/uploads
      - school_private_uploads:/var/www/storage/uploads

volumes:
  school_mysql_data:
  school_profile_uploads:
  school_private_uploads:
